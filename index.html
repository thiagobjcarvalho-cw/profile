<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thiago Carvalho - Full Stack Developer Senior</title>
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    
    <!-- Material Design Icons -->
    <link href="https://cdn.jsdelivr.net/npm/@mdi/font@7.4.47/css/materialdesignicons.min.css" rel="stylesheet">
    
    <!-- Vuetify CSS -->
    <link href="https://cdn.jsdelivr.net/npm/vuetify@3.4.4/dist/vuetify.min.css" rel="stylesheet">
    
    <style>
/* BARRA LARANJA ANIMADA */
.top-orange-bar {
    animation: orange-pulse 3s ease-in-out infinite !important;
}

@keyframes orange-pulse {
    0%, 100% { 
        box-shadow: 0 2px 8px rgba(255, 107, 53, 0.4);
        filter: brightness(1);
    }
    50% { 
        box-shadow: 0 4px 15px rgba(255, 107, 53, 0.8);
        filter: brightness(1.2);
    }
}

        /* BARRA EMBAIXO DO HEADER */
        .header-bottom-bar {
            position: fixed;
            top: 64px;
            left: 0;
            right: 0;
            height: 3px;
            background: linear-gradient(270deg, #FF6B35 0%, #F59E0B 50%, #FF6B35 100%);
            z-index: 9998;
            animation: slideFromRight 2s ease-out;
            transform-origin: right;
        }

        @keyframes slideFromRight {
            0% { 
                transform: scaleX(0);
                transform-origin: right;
            }
            100% { 
                transform: scaleX(1);
                transform-origin: right;
            }
        }

        .v-application { font-family: 'Inter', sans-serif !important; }
        .loading-screen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(135deg, #0F0F23 0%, #1a1a3a 100%);
            display: flex; align-items: center; justify-content: center;
            z-index: 9999; color: white; flex-direction: column;
        }
        .loading-spinner {
            width: 60px; height: 60px; border: 3px solid rgba(255,255,255,0.1);
            border-top: 3px solid #3B82F6; border-radius: 50%;
            animation: spin 1s linear infinite; margin-bottom: 20px;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div id="loading-screen" class="loading-screen">
        <div class="loading-spinner"></div>
        <h3>Carregando portfólio...</h3>
        <p>Thiago Carvalho - Full Stack Developer</p>
    </div>
    
    <div id="app"></div>

    <!-- Vue 3 -->
    <script src="https://unpkg.com/vue@3.4.0/dist/vue.global.js"></script>
    <!-- Vuetify 3 -->
    <script src="https://cdn.jsdelivr.net/npm/vuetify@3.4.4/dist/vuetify.min.js"></script>
    <!-- Main App -->
    <script src="./src/main.js"></script>
    
    <script>
        setTimeout(() => {
            const loading = document.getElementById('loading-screen');
            if (loading) loading.style.display = 'none';
        }, 2000);
    </script>
</body>
</html>
